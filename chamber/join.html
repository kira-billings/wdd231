    <body>
        <header>
            <img src="images/nlv-icon.svg" alt="site logo" width="512" height="512">
            <span>North Las Vegas Chamber of Commerce</span>

           
            <button id="ham-btn" class="hamburger" aria-label="menu"></button>
        </header>
            <nav id="nav-bar" class="navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Discover</a></li>
                    <li><a href="directory.html">Directory</a></li>
                    <li><a href="#"  class="current">Join</a></li>
                </ul>
            </nav>
        <main>
            
            <h1>Application to Join</h1>
            <div id="join-section">
                <form method="get" action="thankyou.html" class="join-form">
                    <fieldset>
                        <div>Applicant Information</div>
                        <label>Business or Organization Name 
                            <input
                                type="text" name="orgName" required title="business or organization name" autocomplete="organization">
                        </label>
                        <label>Your First Name 
                            <input
                                type="text" name="fname" required title="given name" autocomplete="given-name">
                        </label>
                        <label>Your Last Name 
                            <input 
                                type="text" name="lname" required title="family-name" 
                                autocomplete="family-name">
                        </label>
                        <label>Your Organizational Title 
                            <input 
                                type="text" name="orgTitle" required title="Organizational Title" 
                                autocomplete="organization-title" pattern="[A-Za-z\s-]{7,}">
                        </label>
                        <label>Email 
                            <input 
                                type="email" name="email" required title="email"
                                placeholder="someone@gmail.com">
                        </label>
                        <label>Phone 
                            <input 
                                type="tel" name="phone" required title="phone"
                                placeholder="123-555-1234">
                        </label>
                        <label>Business or Organization Description 
                            <textarea 
                                name="orgDesc" required 
                                title="Business or organization description" 
                                placeholder="Give us a short description of your business for the website directory." 
                                rows="5" 
                                cols="33"></textarea>
                        </label>
                    </fieldset>
                    <fieldset>
                        <div>Membership Level</div>
                        <label><input type="radio" name="membershipLevel" value="np">
                            Non-profit Membership</label>
                        <label><input type="radio" name="membershipLevel" value="bronze">
                            Bronze Membership</label>
                        <label><input type="radio" name="membershipLevel" value="silver">
                            Silver Membership</label>
                        <label><input type="radio" name="membershipLevel" value="gold">
                            Gold Membership</label>
                    </fieldset>
                    <input type="hidden" name="timestamp" id="timestamp">
                    <input type="submit" value = "Join Us">
                </form>
            
            <section id="animatedContainer">
            </section>
            </div>
            <dialog id="dialogBox">
            </dialog>
        </main>
